<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f79"><title>Trial Pvt Car — Quote Builder</title>
<style>
:root{--blue:#104780;--blue2:#2468d8;--green:#13785d;--ink:#17283f;--muted:#68788c;--line:#dce4ed;--bg:#f2f5fa;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}.top{background:linear-gradient(120deg,#0c315e,#1557a0);color:#fff;padding:16px max(16px,calc((100% - 1040px)/2));display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:13px;background:#ffffff22;border:1px solid #ffffff55;display:grid;place-items:center;font-weight:900}.top h1{font-size:18px;margin:0}.top p{font-size:12px;margin:3px 0 0;color:#d8e7ff}.wrap{max-width:1040px;margin:22px auto;padding:0 14px 120px}.intro{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:16px}.intro h2{margin:0 0 5px;font-size:clamp(23px,4vw,31px)}.intro p,.muted{color:var(--muted);font-size:13px;margin:0;line-height:1.5}.tag{font-size:11px;font-weight:800;background:#fff0d3;color:#865b13;border-radius:30px;padding:8px 10px;white-space:nowrap}.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}.prog{background:#e5ebf3;color:#65758a;border-radius:8px;padding:9px 7px;font-size:10px;font-weight:800;text-align:center}.prog.active{background:#dceaff;color:#124c91;box-shadow:inset 0 0 0 1px #9fc2f8}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 5px 20px #16375b08;margin-bottom:15px}.card h3{font-size:18px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 17px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#465b73}.field input,.field select{width:100%;min-width:0;border:1px solid #d4deea;background:#fbfcfe;border-radius:10px;padding:12px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #2468d81b}.wide{grid-column:1/-1}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{border:1.5px solid var(--line);background:#fff;border-radius:15px;padding:19px 16px;text-align:left;cursor:pointer;min-height:116px}.choice strong{display:block;font-size:17px;margin-bottom:7px}.choice small{display:block;color:var(--muted);font-size:12px;line-height:1.45}.choice.selected{border:2px solid var(--green);background:#effaf5;box-shadow:0 0 0 4px #13785d12}.choice.selected strong:before{content:'✓ ';color:var(--green)}.radioCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.radioCard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:15px;cursor:pointer;font-weight:800}.radioCard:has(input:checked){border:2px solid var(--green);background:#effaf5}.radioCard input{accent-color:var(--green);width:18px;height:18px}.note{background:#fff8e7;border:1px solid #f0dfb7;border-radius:10px;padding:12px;color:#76551a;font-size:12px;line-height:1.5;margin-top:12px}.good{background:#edf8f3;border-color:#cce9dc;color:#245e4c}.hidden{display:none!important}.sticky{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:12px max(14px,calc((100% - 1012px)/2));display:flex;gap:12px;z-index:5}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:850;cursor:pointer;min-height:52px}.btn.primary{background:var(--blue2);color:#fff;flex:1}.btn.back{background:#fff;border:1px solid var(--line);color:var(--ink);min-width:34%}.btn:disabled{opacity:.5;cursor:not-allowed}.sectionHead{display:flex;align-items:center;gap:10px;margin:4px 0 13px}.sectionHead span{background:#e7efff;color:#1c58a6;border-radius:8px;padding:6px 9px;font-weight:900;font-size:12px}.checklist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.check{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer}.check:has(input:checked){background:#f0f8ff;border-color:#9cbce8}.check input{accent-color:var(--blue2);margin-top:3px;width:17px;height:17px}.check b{display:block;font-size:13px}.check small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.4}.subfields{padding:13px;background:#f7f9fc;border:1px solid var(--line);border-radius:12px;margin-top:10px}.amount{font-size:27px;font-weight:900;color:#105c49}.breakdown{display:grid;grid-template-columns:1fr auto;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.breakdown div{padding:12px;border-bottom:1px solid var(--line);font-size:13px}.breakdown div:nth-last-child(-n+2){border-bottom:0}.breakdown .head{background:#e8f1ff;color:#144a89;font-weight:850}.breakdown .sum{background:#e9f8f0;color:#135c44;font-weight:900}.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:14px}.backtop{border:0;background:transparent;color:var(--blue);font-weight:800;padding:0 0 15px;cursor:pointer}.empty{border:1px dashed #bdcddd;border-radius:12px;padding:16px;color:var(--muted);font-size:13px}
@media(max-width:600px){.wrap{margin:16px auto;padding:0 11px 110px}.card{padding:16px}.fields,.checklist{grid-template-columns:1fr}.wide{grid-column:auto}.intro{flex-direction:column}.progress{grid-template-columns:repeat(3,1fr)}.prog{font-size:10px}.choicegrid,.radioCards{grid-template-columns:1fr}.choice{min-height:auto}.sticky{padding:10px;gap:8px}.btn{padding:12px 9px;font-size:14px}.btn.back{min-width:31%}}
</style></head><body>
<header class="top"><div class="logo">TP</div><div><h1>Trial Pvt Car</h1><p>Private Car Premium Calculation · Separate test project</p></div></header>
<main class="wrap"><div class="intro"><div><h2 id="pageTitle">Select vehicle type</h2><p id="pageDesc">Build a quote step by step using the supplied formula and rating tables.</p></div><span class="tag">TRIAL · RATE TABLE BASIS</span></div>
<div class="progress" id="progress"></div><div id="screen"></div></main>
<div class="sticky"><button class="btn back" id="backBtn">← Back</button><button class="btn primary" id="nextBtn">Continue →</button></div>
<script>
const $=id=>document.getElementById(id), state={kind:'',regdate:'',zone:'B',fuel:'Petrol',cc:'',externalCng:false,ncb:0,idv:50000,cngIdv:0,elecIdv:0,nonElecIdv:0,invoiceValue:0,plan:'',covers:{nildep:true},additional:{},other:{},discounts:{uw:0,nildep:20,anti:false},invoiceValue:0,epcNetRate:0,ownerCPA:true,cpaYears:1,claim:'',policyStart:'',policyEnd:'',steps:0};
const pages=['Vehicle','NCB','IDV','Plan','Coverage','Other cover','Discounts','Quote'];
const today=new Date().toISOString().slice(0,10);
const money=n=>'₹'+Math.round(Number(n)||0).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function field(id,label,value='',type='text',placeholder='',extra=''){return '<div class="field"><label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" placeholder="'+placeholder+'" '+extra+'></div>'}
function selectField(id,label,opts,val){return '<div class="field"><label for="'+id+'">'+label+'</label><select id="'+id+'">'+opts.map(o=>'<option value="'+esc(o[0])+'" '+(String(o[0])===String(val)?'selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select></div>'}
function check(id,label,desc,checked=false){return '<label class="check"><input id="'+id+'" type="checkbox" '+(checked?'checked':'')+'><span><b>'+label+'</b><small>'+desc+'</small></span></label>'}
function ncbPage(){return '<section class="card"><button class="backtop" onclick="go(0)">← Back</button><div class="sectionHead"><span>STEP 2</span><h3>Eligible No Claim Bonus (NCB)</h3></div><p class="sub">Choose NCB according to the previous policy and claim history. This is an input; eligibility should be verified from policy records.</p><div class="radioCards">'+[0,20,25,35,45,50].map(v=>'<label class="radioCard"><input type="radio" name="ncb" value="'+v+'" '+(state.ncb===v?'checked':'')+'><span>'+v+'% NCB</span></label>').join('')+'</div><div class="note">NCB is normally a discount on the eligible own-damage premium, not on third-party premium. Final application depends on insurer rules and declarations.</div></section>'}
function vehiclePage(){return '<section class="card"><h3>Choose vehicle</h3><p class="sub">This selection determines the vehicle details and eligible plan options.</p><div class="choicegrid"><button class="choice '+(state.kind==='new'?'selected':'')+'" onclick="setKind(\'new\')"><strong>Brand new vehicle</strong><small>New registration / first insurance. Bundle policy: 2-year own damage + 3-year third party (as requested).</small></button><button class="choice '+(state.kind==='existing'?'selected':'')+'" onclick="setKind(\'existing\')"><strong>Existing vehicle</strong><small>Enter registration date, zone, fuel and engine capacity.</small></button></div></section>'+(state.kind?'<section class="card"><h3>Vehicle information</h3><p class="sub">Zone A: Ahmedabad, Bengaluru, Chennai, Hyderabad, Kolkata, Mumbai, New Delhi (Delhi-NCR), Pune. Zone B: rest of India.</p><div class="fields">'+field('regdate','Date of registration',state.regdate|| (state.kind==='new'?today:''),'date')+selectField('zone','Zone',[['A','Zone A — listed cities'],['B','Zone B — rest of India']],state.zone)+selectField('fuel','Fuel type',[['Petrol','Petrol'],['Diesel','Diesel'],['Petrol+CNG','Petrol + CNG'],['Hybrid petrol','Hybrid petrol'],['EV','EV — Electric']],state.fuel)+(state.fuel==='EV'?field('cc','Motor power (kW)',state.cc,'number','Enter kW','min="0" step="0.1"'):field('cc','Engine capacity (CC)',state.cc,'number','Enter CC','min="0"'))+(state.fuel==='Petrol+CNG'?'<div class="field wide"><label class="check"><input id="externalCng" type="checkbox" '+(state.externalCng?'checked':'')+'><span><b>Click if external CNG</b><small>External CNG kit fitted separately</small></span></label></div>':'')+'</div></section>':'')}
function idvPage(){return '<section class="card"><button class="backtop" onclick="go(1)">← Back</button><div class="sectionHead"><span>STEP 3</span><h3>Vehicle Value (IDV)</h3></div><p class="sub">Enter the vehicle value and fitted accessories. Total IDV updates automatically.</p><div class="fields">'+field('idv','Vehicle IDV (₹)',state.idv,'number','Vehicle value','min="0"')+field('cngIdv','External CNG (₹)',state.externalCng?state.cngIdv:0,'number','External kit value','min="0" '+(!state.externalCng?'disabled':''))+field('elecIdv','Electrical accessories (₹)',state.elecIdv,'number','Electrical accessories value','min="0"')+field('nonElecIdv','Non-electrical accessories (₹)',state.nonElecIdv,'number','Non-electrical accessories value','min="0"')+field('invoiceValue','Current invoice value (₹)',state.invoiceValue,'number','Required for Tyre & Rim cover','min="0"')+'</div><div class="subfields"><b>IDV 1</b><div class="amount" id="totalIdv">'+money(totalIdv())+'</div><p class="muted">Vehicle IDV + non-electrical accessories + electrical accessories (EAV). External CNG is separate.</p></div>'+(state.externalCng?'':'<div class="note">External CNG value is disabled because “Click if external CNG” was not selected on the vehicle page.</div>')+'</section>'}
function vehicleAge(){if(!state.regdate)return null;let d=new Date(state.regdate+'T00:00:00'),n=new Date();return Math.max(0,(n-d)/(365.2425*86400000))}
function plans(){if(state.kind==='new')return [['bundle','Bundle policy — 2-year OD + 3-year TP','Own damage for 2 years and third-party for 3 years. Rate table/tenure rules must be verified.']];let a=vehicleAge();if(a!==null&&a<2)return [['saod','Standalone Own Damage (SAOD)','Own-damage only. Requires valid third-party cover.']];if(a!==null&&a>=2&&a<3)return [['saod','Standalone Own Damage (SAOD)','Own-damage cover only.'],['package','Package / Comprehensive Policy','Own damage and third-party cover together.'],['liability','Liability Only Policy','Third-party liability cover only.']];return [['saod','Standalone Own Damage (SAOD)','Own-damage only, subject to valid TP cover.'],['package','Package / Comprehensive Policy','Own damage and third-party cover together.'],['liability','Liability Only Policy','Third-party liability cover only.']]}
function planPage(){let p=plans();return '<section class="card"><button class="backtop" onclick="go(2)">← Back</button><div class="sectionHead"><span>STEP 4</span><h3>Choose your plan</h3></div><p class="sub">Options are shown from vehicle type and age rules you specified.</p><div class="choicegrid">'+p.map(x=>'<button class="choice '+(state.plan===x[0]?'selected':'')+'" onclick="setPlan(\''+x[0]+'\')"><strong>'+x[1]+'</strong><small>'+x[2]+'</small></button>').join('')+'</div><div class="note">Exact policy tenure, rates and availability must be checked against the insurer's current product rules. Existing vehicle age: '+(vehicleAge()===null?'registration date not entered':vehicleAge().toFixed(2)+' years')+'.</div></section>'}
const popular=[['nildep','Nil Depreciation','Rate from table; 20% discount on nil-dep rate per supplied chart.'],['rti','Return to Invoice (RTI)','0.3% / 0.4% / 0.6% of IDV for 1 / 2 / 3 years.'],['engine','Engine Protection Cover','Vehicle-age and fuel-specific rate from supplied chart; apply discount/loading conditions.'],['consumable','Consumables Cover','Up to 1 yr: 0.1% IDV; 1–3 yr: 0.11%; 3–5 yr: 0.14%.'],['battery','Battery Protection (EV)','Vehicle age rate table supplied; requires verified SI and rate.']];
const additional=[['belongings','Personal belongings','Select ₹5,000 or ₹10,000 sum insured.'],['emi','EMI protection','Choose 1 month or 2 months and enter EMI amount.'],['altcar','Alternative car','5 days ₹250; 10 days ₹400; 15 days ₹550.'],['towing','Towing charge','Choose ₹500, ₹1,000 or ₹1,500.'],['key','Key replacement','Up to ₹6 lakh IDV ₹250; ₹6–12 lakh ₹300; ₹12–25 lakh ₹400; above ₹25 lakh ₹500.'],['geo','Geographic extension','Ask for destination country and display additional question.'],['payd','Pay As You Drive','15% of IDV per supplied chart; verify product applicability.'],['tyre','Tyre & Rim Protection','0.20% of current invoice value per supplied chart.'],['personal','Personal accident — belongings','Personal belongings SI ₹5,000 premium ₹400; SI ₹10,000 premium ₹650.']];
function coverPage(){let a='<section class="card"><button class="backtop" onclick="go(3)">← Back</button><div class="sectionHead"><span>STEP 5</span><h3>Choose your coverage</h3></div><p class="sub">Choose popular and additional covers. Pricing uses only the supplied rate chart where a rate is legible.</p><h3>Popular coverage</h3><div class="checklist">'+popular.map(x=>check('cov_'+x[0],x[1],x[2],!!state.covers[x[0]])).join('')+'</div><h3 style="margin-top:20px">Additional coverage</h3><div class="checklist">'+additional.map(x=>check('cov_'+x[0],x[1],x[2],!!state.covers[x[0]])).join('')+'</div></section>';
if(state.covers.belongings||state.covers.emi||state.covers.altcar||state.covers.towing||state.covers.key||state.covers.geo||state.covers.personal){a+='<section class="card"><h3>Selected cover details</h3><div class="fields">';
if(state.covers.belongings)a+=selectField('belongingsSI','Personal belongings sum insured',[['5000','₹5,000'],['10000','₹10,000']],state.additional.belongingsSI||'5000');
if(state.covers.emi)a+=selectField('emiMonths','EMI protection period',[['1','1 month'],['2','2 months']],state.additional.emiMonths||'1')+field('emiAmount','Monthly EMI amount (₹)',state.additional.emiAmount||'','number','Enter EMI','min="0"');
if(state.covers.altcar)a+=selectField('altDays','Alternative car duration',[['5','5 days — ₹250'],['10','10 days — ₹400'],['15','15 days — ₹550']],state.additional.altDays||'5');
if(state.covers.towing)a+=selectField('towingAmt','Towing charge',[['500','₹500'],['1000','₹1,000'],['1500','₹1,500']],state.additional.towingAmt||'500');
if(state.covers.key)a+='<div class="field"><label>Key replacement estimate</label><input value="'+money(keyRate())+'" readonly></div>';
if(state.covers.geo)a+=field('country','Destination country',state.additional.country||'','text','Enter country name')+'<div class="field"><label>Geographic extension</label><input value="Destination / country extension — manual rate required" readonly></div>';
if(state.covers.personal)a+=selectField('personalSI','Personal belongings cover',[['5000','₹5,000 SI — ₹400'],['10000','₹10,000 SI — ₹650']],state.additional.personalSI||'5000');
a+='</div></section>'}
return a}
function otherPage(){return '<section class="card"><button class="backtop" onclick="go(4)">← Back</button><div class="sectionHead"><span>STEP 6</span><h3>Other coverage / Liability & PA</h3></div><p class="sub">Enter the number of persons covered. Personal accident sum insured is in multiples of ₹1 lakh.</p><div class="fields">'+field('llEmployee','LL employee — IMT 28 (count)',state.other.llEmployee||0,'number','0','min="0"')+field('llDriver','LL paid driver / conductor / cleaner — IMT 29 (count)',state.other.llDriver||0,'number','0','min="0"')+field('paDriverCount','PA paid driver / conductor / cleaner (count)',state.other.paDriverCount||0,'number','0','min="0"')+selectField('paDriverSI','PA paid driver SI',[['1','₹1 lakh'],['2','₹2 lakh'],['3','₹3 lakh'],['4','₹4 lakh'],['5','₹5 lakh'],['10','₹10 lakh']],state.other.paDriverSI||'1')+field('paPassengerCount','PA unnamed passengers (count)',state.other.paPassengerCount||0,'number','0','min="0"')+selectField('paPassengerSI','PA unnamed passenger SI per person',[['1','₹1 lakh'],['2','₹2 lakh'],['3','₹3 lakh'],['4','₹4 lakh'],['5','₹5 lakh'],['10','₹10 lakh']],state.other.paPassengerSI||'1')+'</div><div class="subfields"><label class="check"><input id="cpa" type="checkbox" '+(state.ownerCPA?'checked':'')+'><span><b>Compulsory Personal Accident (CPA) — Owner Driver</b><small>₹320 for 1 year / ₹900 for 3 years per supplied chart, subject to eligibility and legal requirements.</small></span></label><div class="field" style="margin-top:12px">'+selectField('cpaYears','CPA tenure',[['1','1 year — ₹320'],['3','3 years — ₹900']],String(state.cpaYears)).replace('<div class="field">','<div class="field">')+'</div></div><div class="note">LL / PA rates and applicability depend on seating capacity, persons covered, policy type, and current insurer rules. Entering counts captures the data; final charges need the applicable tariff.</div></section>'}
function discountPage(){return '<section class="card"><button class="backtop" onclick="go(5)">← Back</button><div class="sectionHead"><span>STEP 7</span><h3>Discounts and underwriting</h3></div><p class="sub">Select only discounts supported by documentation and insurer approval.</p><div class="fields">'+selectField('uwDiscount','Underwriting discount (%)',[['0','0%'],['5','5%'],['10','10%'],['15','15%'],['20','20%']],String(state.discounts.uw))+selectField('nilDiscount','Nil depreciation discount',[['0','0%'],['20','20% (chart)']],String(state.discounts.nildep))+selectField('epcNetRate','EPC: choose ONE net adjustment',[['15','15% net discount'],['10','10% net discount'],['0','No discount or loading'],['-10','10% net loading'],['-15','15% net loading']],String(state.epcNetRate))+'<div class="field wide"><label class="check"><input id="antiTheft" type="checkbox" '+(state.discounts.anti?'checked':'')+'><span><b>Anti-theft discount</b><small>Formula from supplied chart: 2.5% of (IDV + electric IDV + external CNG + EPC − underwriting discount); capped at ₹500. Eligibility must be verified.</small></span></label></div></div><div class="note">EPC discount/loading: 10% discount if CC below 1500 or IDV ≤ ₹10 lakh; 15% if both conditions apply. 10% loading if CC above 2500 or IDV ≥ ₹20 lakh; 15% if both apply. Exact application needs confirmation against the source tariff wording.</div></section>'}
function totalIdv(){return Math.max(0,+state.idv||0)+Math.max(0,+state.nonElecIdv||0)+Math.max(0,+state.elecIdv||0)}
function keyRate(){let v=totalIdv();return v<=600000?250:v<=1200000?300:v<=2500000?400:500}
function ageBand(){let a=vehicleAge();if(a===null)return 0;if(a<=0.5)return 0;if(a<=1.5)return 1;if(a<=3)return 2;if(a<=4)return 3;if(a<=5)return 4;return 5}
function odRate(){let a=vehicleAge();let row=a===null||a<=5?0:a<=10?1:2;let cc=state.fuel==='EV'?+(state.cc||0)*1: +(state.cc||0);let col=cc<=1000?0:cc<=1500?1:2;let z=state.zone==='A'?0:1;let tables=[[[3.127,3.283,3.44],[3.283,3.447,3.612],[3.362,3.529,3.698]],[[3.039,3.191,3.343],[3.191,3.351,3.51],[3.267,3.43,3.594]]];return (tables[z]||tables[1])[row][col]/100}
function calcQuote(){
 const vehicleIDV=Math.max(0,+state.idv||0), eav=Math.max(0,+state.elecIdv||0), nonElec=Math.max(0,+state.nonElecIdv||0), extCngValue=state.externalCng?Math.max(0,+state.cngIdv||0):0;
 const IDV1=vehicleIDV+nonElec+eav;
 const cc=+(state.cc||0), age=vehicleAge(), diesel=state.fuel==='Diesel';
 const IDV=vehicleIDV+nonElec;
 const odBase=IDV*odRate();
 const eavPremium=eav*.04;
 const OD1=odBase+eavPremium;
 const externalCngPremium=extCngValue*.04;
 const OD2=OD1+externalCngPremium;
 const ncbRate=Math.max(0,Math.min(50,+state.ncb||0))/100;
 const ageIndex=Math.min(ageBand(),6);
 const nilRates=[[.0037,.0056],[.0059,.0085],[.0087,.0113],[.011,.0138],[.0117,.0149],[.0144,.021],[.0172,.0245]];
 const nilDep=state.covers.nildep?IDV1*nilRates[ageIndex][diesel?1:0]:0;
 const consumable=state.covers.consumable?IDV1*(age<=1?.001:age<=3?.0011:age<=5?.0014:0):0;
 const rti=state.covers.rti?IDV*([.003,.004,.006][Math.min(2,Math.max(0,Math.round(age||0)-1))]||.003):0;
 const tyreRim=state.covers.tyre?Math.max(0,+state.invoiceValue||0)*.002:0;
 const epcRates=[[.0016,.0019],[.0018,.0022],[.0021,.0025],[.0025,.003],[.003,.0037],[.0018,.0022]];
 const EPC1=state.covers.engine?IDV*epcRates[Math.min(ageBand(),5)][diesel?1:0]:0;
 const netEpcRate=(+state.epcNetRate||0)/100; // One net adjustment only: positive = discount, negative = loading.
 const epcNetAdjustmentAmount=EPC1*Math.abs(netEpcRate)*(1-ncbRate);
 const epcPremium=netEpcRate>0?EPC1-epcNetAdjustmentAmount:netEpcRate<0?EPC1+epcNetAdjustmentAmount:EPC1;
 const epcDiscountLoadingAmount=epcNetAdjustmentAmount;
 const uwDiscount=OD2*(+state.discounts.uw||0)/100;
 const inbuiltCng=state.fuel==='Petrol+CNG'?(OD1+epcPremium-uwDiscount)*.05:0;
 const antiBase=Math.max(0,OD2+epcPremium-uwDiscount);
 const antiTheft=state.discounts.anti?Math.min(500,antiBase*.025):0;
 const electricPremium=eavPremium;
 const altCar=state.covers.altcar?({5:250,10:400,15:550}[+state.additional.altDays||5]||250):0;
 const personalEffects=state.covers.belongings?({5000:400,10000:650}[+state.additional.belongingsSI||5000]||400):0;
 const emi=state.covers.emi?(+state.additional.emiAmount||0)*(+state.additional.emiMonths||1)*((+state.additional.emiMonths||1)===1?.07:.12):0;
 const key=state.covers.key?keyRate():0;
 const towing=state.covers.towing?+state.additional.towingAmt||500:0;
 const payd=state.covers.payd?vehicleIDV*.15:0;
 const geo=0; // geographic extension rate needs user/insurer tariff input
 const battery=state.covers.battery?vehicleIDV*([.0034,.0038,.0045,.0053,.0053][Math.min(ageBand(),4)]||.0034):0;
 const epc=state.covers.engine?epcPremium:0;
 const otherAddons=nilDep+consumable+rti+tyreRim+epc+altCar+personalEffects+emi+key+towing+payd+battery;
 const tp=state.plan==='saod'?0:state.plan==='liability'?(cc<=1000?2094:cc<=1500?3416:7897):state.plan==='bundle'?((cc<=1000?6521:cc<=1500?10640:24596)/3):(cc<=1000?2094:cc<=1500?3416:7897);
 const cpa=state.ownerCPA?(state.cpaYears===3?900:320):0;
 const ncbBase=Math.max(0,OD2+EPC1+rti+personalEffects+geo+altCar+inbuiltCng-antiTheft-uwDiscount);
 const ncbAmount=ncbBase*ncbRate;
 const additions=OD2+nilDep+consumable+rti+tyreRim+epc+inbuiltCng+tp+cpa+altCar+personalEffects+emi+key+towing+payd+battery;
 const totalBeforeGST=Math.max(0,additions-ncbAmount-antiTheft-uwDiscount);
 const gst=totalBeforeGST*.18;
 return {vehicleIDV,eav,nonElec,extCngValue,IDV1,odBase,eavPremium,OD1,externalCngPremium,OD2,nilDep,consumable,rti,tyreRim,EPC1,epcDiscountLoadingAmount,epcPremium,uwDiscount,inbuiltCng,antiTheft,ncbBase,ncbAmount,tp,cpa,altCar,personalEffects,emi,key,towing,payd,battery,geo,additions,totalBeforeGST,gst,total:totalBeforeGST+gst};
}
function quotePage(){let q=calcQuote();let rows=[
['Vehicle IDV',q.vehicleIDV],['Non-electrical accessories value',q.nonElec],['Electrical accessories value (EAV)',q.eav],['IDV 1 = Vehicle IDV + non-electric accessories + EAV',q.IDV1],
['Basic OD premium = IDV (vehicle + non-electric accessories) × rate',q.odBase],['Electrical accessories premium = EAV × 4%',q.eavPremium],['OD 1 = Basic OD + EAV premium',q.OD1],['External CNG premium = value × 4%',q.externalCngPremium],['OD 2 = OD 1 + external CNG premium',q.OD2],
['Nil depreciation = IDV 1 × rate',q.nilDep],['Consumables = IDV 1 × rate',q.consumable],['RTI = IDV × rate',q.rti],['Tyre & Rim = invoice value × rate',q.tyreRim],['EPC 1 = IDV × EPC rate',q.EPC1],['EPC net discount/loading amount',q.epcDiscountLoadingAmount],['EPC premium',q.epcPremium],['In-built CNG',q.inbuiltCng],['U/W discount = OD 2 × rate',-q.uwDiscount],['Anti-theft discount (max ₹500)',-q.antiTheft],['NCB calculation base',q.ncbBase],['NCB discount',-q.ncbAmount],['Third-party premium (indicative)',q.tp],['Owner-driver CPA',q.cpa],['Personal effects',q.personalEffects],['Alternative car',q.altCar],['Other selected covers',q.consumable+q.rti+q.tyreRim+q.emi+q.key+q.towing+q.payd+q.battery],['Net premium before GST',q.totalBeforeGST],['GST (18%)',q.gst]];
return '<section class="card"><button class="backtop" onclick="go(6)">← Back</button><div class="sectionHead"><span>STEP 8</span><h3>Premium quotation</h3></div><p class="sub">Breakdown follows your defined IDV 1, OD 1, OD 2 and NCB formula references.</p><div class="subfields"><div class="muted">Estimated premium payable</div><div class="amount">'+money(q.total)+'</div><div class="muted">Plan: '+esc((plans().find(p=>p[0]===state.plan)||[])[1]||'Not selected')+'</div></div><div class="breakdown" style="margin-top:14px"><div class="head">Premium component</div><div class="head">Amount</div>'+rows.map(r=>'<div>'+esc(r[0])+'</div><div style="text-align:right;font-weight:750">'+(r[1]<0?'− ':'')+money(Math.abs(r[1]))+'</div>').join('')+'<div class="sum">Total premium payable (including GST)</div><div class="sum" style="text-align:right">'+money(q.total)+'</div></div><div class="note">Trial calculation based on the formula instructions supplied. Rates and policy eligibility still require tariff verification. Geographic extension is not included in the total until its rate is supplied. Third-party and bundle rates are indicative from the screenshot.</div><div class="actions"><button class="btn" style="background:#e8f0ff;color:#154f97;flex:1" onclick="window.print()">Print / Save PDF</button><button class="btn" style="background:#eaf7f0;color:#176046;flex:1" onclick="saveDraft()">Save quote draft</button></div></section>'}
function render(){
 const titles=['Select vehicle type','Eligible No Claim Bonus (NCB)','Vehicle Value (IDV)','Choose your plan','Choose your coverage','Other coverage / Liability & PA','Discounts and underwriting','Premium quotation'];
 const descs=['Build a quote step by step using the supplied formula and rating tables.','Choose eligible NCB based on previous policy and claim history.','Enter vehicle IDV and accessories; totals update automatically.','Choose the policy type available for this vehicle.','Select the optional covers you need.','Enter liability and personal accident details.','Apply eligible discounts or loading.','Review the premium breakdown and save or print your quote.'];
 const views=[vehiclePage,ncbPage,idvPage,planPage,coverPage,otherPage,discountPage,quotePage];
 $('pageTitle').textContent=titles[state.steps]||titles[0];
 $('pageDesc').textContent=descs[state.steps]||descs[0];
 $('progress').innerHTML=pages.map((p,i)=>'<div class="prog '+(i===state.steps?'active':'')+'">'+(i+1)+'. '+esc(p)+'</div>').join('');
 $('screen').innerHTML=views[state.steps]();
 $('backBtn').disabled=state.steps===0;
 $('backBtn').style.opacity=state.steps===0?'.45':'1';
 $('nextBtn').textContent=state.steps===7?'Finish':'Continue →';
 if(state.steps===7)$('nextBtn').classList.add('hidden');else $('nextBtn').classList.remove('hidden');
}
function sync(){if(state.steps===0){if($('regdate'))state.regdate=$('regdate').value;if($('zone'))state.zone=$('zone').value;if($('fuel'))state.fuel=$('fuel').value;if($('cc'))state.cc=$('cc').value;if($('externalCng'))state.externalCng=$('externalCng').checked}
if(state.steps===1){let n=document.querySelector('input[name="ncb"]:checked');if(n)state.ncb=+n.value}
if(state.steps===2){['idv','cngIdv','elecIdv','nonElecIdv','invoiceValue'].forEach(k=>{if($(k))state[k]=Math.max(0,+$(k).value||0)})}
if(state.steps===4){[...popular,...additional].forEach(x=>{let el=$('cov_'+x[0]);if(el)state.covers[x[0]]=el.checked});['belongingsSI','emiMonths','emiAmount','altDays','towingAmt','country','personalSI'].forEach(k=>{if($(k))state.additional[k]=$(k).value});if($('invoiceValue'))state.invoiceValue=+$('invoiceValue').value||0}
if(state.steps===5){['llEmployee','llDriver','paDriverCount','paDriverSI','paPassengerCount','paPassengerSI'].forEach(k=>{if($(k))state.other[k]=$(k).value});if($('cpa'))state.ownerCPA=$('cpa').checked;if($('cpaYears'))state.cpaYears=+$('cpaYears').value}
if(state.steps===6){if($('uwDiscount'))state.discounts.uw=+$('uwDiscount').value;if($('nilDiscount'))state.discounts.nildep=+$('nilDiscount').value;if($('epcNetRate'))state.epcNetRate=+$('epcNetRate').value;if($('antiTheft'))state.discounts.anti=$('antiTheft').checked}}
function go(i){sync();state.steps=Math.max(0,Math.min(7,i));render();window.scrollTo({top:0,behavior:'smooth'})}
function setKind(k){state.kind=k;state.regdate=k==='new'?today:state.regdate;state.plan='';render()}
function setPlan(p){state.plan=p;render()}
function next(){sync();if(state.steps===0){if(!state.kind){alert('Please select Brand new vehicle or Existing vehicle.');return}if(!state.regdate){alert('Please enter date of registration.');return}if(!state.cc||+state.cc<=0){alert(state.fuel==='EV'?'Please enter motor power in kW.':'Please enter engine capacity in CC.');return}if(state.fuel==='Petrol+CNG'&&state.externalCng===undefined)state.externalCng=false}
if(state.steps===3){let p=plans();if(!p.some(x=>x[0]===state.plan)){state.plan=p[0][0]}}
if(state.steps===7){alert('Quote is ready. Use Print / Save PDF or Save quote draft.');return}go(state.steps+1)}
function saveDraft(){sync();let data={...state,calculation:calcQuote(),savedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='trial-pvt-car-quote.json';a.click();URL.revokeObjectURL(a.href)}
$('backBtn').addEventListener('click',()=>go(state.steps-1));$('nextBtn').addEventListener('click',next);document.addEventListener('change',e=>{if(state.steps===0&&['fuel','externalCng'].includes(e.target.id)){sync();render()}else if(state.steps===4&&e.target.id&&e.target.id.startsWith('cov_')){sync();render()}});render();
</script></body></html>
